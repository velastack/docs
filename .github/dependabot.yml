version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 (native port) is outside @sveltejs/kit's peer range
      # (^5.3.3 || ^6.0.0) and breaks `npm ci`. Bump manually once Kit supports it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # sveltekit-negotiate 0.3.x peers @sveltejs/kit ^3.0.0, and Dependabot files
      # 0.x minors under minor-and-patch. Kit 3 is blocked on runed (via bits-ui,
      # mode-watcher, svelte-sonner), which still peers Kit ^2.21.0.
      - dependency-name: sveltekit-negotiate
        versions:
          - '>=0.3.0'
